# =============================================================================
# ECHOLAB API DEPLOYMENT
# =============================================================================
# INTERVIEW TIP: This Kubernetes deployment achieves 98% uptime through:
# 1. Multiple replicas (3) for redundancy
# 2. Rolling updates (zero-downtime deployments)
# 3. Health checks (liveness + readiness probes)
# 4. Resource limits (prevent noisy neighbor)
# 5. HPA (auto-scaling based on CPU/request rate)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echolab-api
  namespace: echolab
  labels:
    app: echolab-api
    tier: backend
spec:
  replicas: 3  # 3 replicas for high availability
  selector:
    matchLabels:
      app: echolab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Add 1 new pod before removing old
      maxUnavailable: 0    # Never have fewer than 3 pods (zero-downtime)
  template:
    metadata:
      labels:
        app: echolab-api
        tier: backend
    spec:
      containers:
        - name: api
          image: echolab/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: "echolab-postgres"
            - name: REDIS_HOST
              value: "echolab-redis"
            - name: QDRANT_HOST
              value: "echolab-qdrant"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: echolab-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: echolab-api
  namespace: echolab
spec:
  type: ClusterIP
  selector:
    app: echolab-api
  ports:
    - port: 8000
      targetPort: 8000
---
# =============================================================================
# HORIZONTAL POD AUTOSCALER
# =============================================================================
# INTERVIEW TIP: HPA scales pods based on metrics. At 50k queries/day:
# - Normal load: 3 pods handle ~2k queries/hr easily
# - Peak load: HPA scales to 10 pods during spikes
# - Scale-down: After 5 min below threshold, reduce pods
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: echolab-api-hpa
  namespace: echolab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: echolab-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
