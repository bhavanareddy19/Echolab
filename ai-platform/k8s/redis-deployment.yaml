# =============================================================================
# REDIS DEPLOYMENT FOR KUBERNETES
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echolab-redis
  namespace: echolab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echolab-redis
  template:
    metadata:
      labels:
        app: echolab-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: echolab-redis
  namespace: echolab
spec:
  type: ClusterIP
  selector:
    app: echolab-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: echolab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
