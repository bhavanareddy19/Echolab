# =============================================================================
# QDRANT VECTOR DATABASE DEPLOYMENT
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echolab-qdrant
  namespace: echolab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echolab-qdrant
  template:
    metadata:
      labels:
        app: echolab-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
            - containerPort: 6334
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"  # Qdrant needs memory for HNSW index
          livenessProbe:
            httpGet:
              path: /readiness
              port: 6333
            periodSeconds: 10
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: echolab-qdrant
  namespace: echolab
spec:
  type: ClusterIP
  selector:
    app: echolab-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: echolab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi  # Enough for 10M embeddings with HNSW index
